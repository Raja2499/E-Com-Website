<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Radial Sunburst Glow -->
    <radialGradient id="sunburstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#faf7f2" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="75%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Bronze Hub Gradient -->
    <radialGradient id="bronzeHub" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#b45309" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>

    <!-- Wheel Background -->
    <radialGradient id="wheelBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </radialGradient>

    <!-- Arc Paths for Arched Typography -->
    <!-- Upper Arc for UTKAL HERITAGE -->
    <path id="upperArc" d="M 95 300 A 205 205 0 0 1 505 300" fill="none" />
    <!-- Lower Arc for AUTHENTIC ODISHA HANDICRAFTS -->
    <path id="lowerArc" d="M 85 300 A 215 215 0 0 0 515 300" fill="none" />
  </defs>

  <!-- Background Soft Sun Rays / Aura -->
  <circle cx="300" cy="300" r="280" fill="url(#sunburstGlow)" />
  
  <!-- Subtle Radiant Ray Lines -->
  <g stroke="#d97706" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6">
    <line x1="300" y1="20" x2="300" y2="580" />
    <line x1="20" y1="300" x2="580" y2="300" />
    <line x1="102" y1="102" x2="498" y2="498" />
    <line x1="102" y1="498" x2="498" y2="102" />
    <line x1="192" y1="38" x2="408" y2="562" />
    <line x1="408" y1="38" x2="192" y2="562" />
    <line x1="38" y1="192" x2="562" y2="408" />
    <line x1="38" y1="408" x2="562" y2="192" />
  </g>

  <!-- Arched Brand Text: UTKAL HERITAGE (Top) -->
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="44" font-weight="900" fill="#7c2d12" letter-spacing="4">
    <textPath href="#upperArc" startOffset="50%" text-anchor="middle">
      UTKAL HERITAGE
    </textPath>
  </text>

  <!-- Arched Subtext: AUTHENTIC ODISHA HANDICRAFTS (Bottom) -->
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#451a03" letter-spacing="5">
    <textPath href="#lowerArc" startOffset="50%" text-anchor="middle">
      AUTHENTIC ODISHA HANDICRAFTS
    </textPath>
  </text>

  <!-- Left and Right Flanking Decorative Dots -->
  <circle cx="112" cy="328" r="4.5" fill="#9a3412" />
  <circle cx="488" cy="328" r="4.5" fill="#9a3412" />

  <!-- ============================================== -->
  <!-- MAIN KONARK SUN TEMPLE CHPass WHEEL (KONARK CHAKRA) -->
  <!-- ============================================== -->
  <g transform="translate(300, 300)">
    
    <!-- Outer Heavy Bronze Rim -->
    <circle cx="0" cy="0" r="142" fill="#5c2605" stroke="#92400e" stroke-width="2" />
    <circle cx="0" cy="0" r="138" fill="url(#goldRim)" stroke="#3f1603" stroke-width="1.5" />
    <circle cx="0" cy="0" r="126" fill="#451a03" />
    <circle cx="0" cy="0" r="122" fill="url(#wheelBg)" stroke="#78350f" stroke-width="3" />

    <!-- Outer Rim Studded Rivets / Medallions (16 studs) -->
    <g fill="#fef08a" stroke="#78350f" stroke-width="1.5">
      <!-- 16 circular studs around rim -->
      <circle cx="0" cy="-132" r="4" />
      <circle cx="50.5" cy="-122" r="4" />
      <circle cx="93.3" cy="-93.3" r="4" />
      <circle cx="122" cy="-50.5" r="4" />
      <circle cx="132" cy="0" r="4" />
      <circle cx="122" cy="50.5" r="4" />
      <circle cx="93.3" cy="93.3" r="4" />
      <circle cx="50.5" cy="122" r="4" />
      <circle cx="0" cy="132" r="4" />
      <circle cx="-50.5" cy="122" r="4" />
      <circle cx="-93.3" cy="93.3" r="4" />
      <circle cx="-122" cy="50.5" r="4" />
      <circle cx="-132" cy="0" r="4" />
      <circle cx="-122" cy="-50.5" r="4" />
      <circle cx="-93.3" cy="-93.3" r="4" />
      <circle cx="-50.5" cy="-122" r="4" />
    </g>

    <!-- 16 Spokes & Filigree Leaf Segments -->
    <!-- 8 Main Cardinal/Diagonal Carved Spokes -->
    <g stroke="#78350f" stroke-width="2.5" fill="#d97706">
      <!-- Spoke 1: North -->
      <path d="M -6 -32 L -9 -118 Q 0 -124 9 -118 L 6 -32 Z" fill="#b45309" />
      <circle cx="0" cy="-78" r="6" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />

      <!-- Spoke 2: North-East -->
      <g transform="rotate(45)">
        <path d="M -5 -32 L -8 -118 Q 0 -123 8 -118 L 5 -32 Z" fill="#c2944b" />
        <circle cx="0" cy="-78" r="5" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />
      </g>

      <!-- Spoke 3: East -->
      <g transform="rotate(90)">
        <path d="M -6 -32 L -9 -118 Q 0 -124 9 -118 L 6 -32 Z" fill="#b45309" />
        <!-- Sacred Eye Motif on East Spoke -->
        <ellipse cx="0" cy="-78" rx="8" ry="5.5" fill="#fef3c7" stroke="#451a03" stroke-width="1.5" />
        <circle cx="0" cy="-78" r="3" fill="#1e3a5f" />
      </g>

      <!-- Spoke 4: South-East -->
      <g transform="rotate(135)">
        <path d="M -5 -32 L -8 -118 Q 0 -123 8 -118 L 5 -32 Z" fill="#c2944b" />
        <circle cx="0" cy="-78" r="5" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />
      </g>

      <!-- Spoke 5: South (Contains the Sacred Metamorphic Stone Carving Motif) -->
      <g transform="rotate(180)">
        <path d="M -6 -32 L -10 -118 Q 0 -124 10 -118 L 6 -32 Z" fill="#b45309" />
        <!-- Carved Temple Rock Motif at 6 o'clock -->
        <polygon points="-12,-62 -8,-106 8,-106 12,-62 0,-52" fill="#78716c" stroke="#292524" stroke-width="1.5" />
        <polygon points="-8,-106 0,-112 8,-106 4,-62 -4,-62" fill="#a8a29e" />
      </g>

      <!-- Spoke 6: South-West -->
      <g transform="rotate(225)">
        <path d="M -5 -32 L -8 -118 Q 0 -123 8 -118 L 5 -32 Z" fill="#c2944b" />
        <circle cx="0" cy="-78" r="5" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />
      </g>

      <!-- Spoke 7: West -->
      <g transform="rotate(270)">
        <path d="M -6 -32 L -9 -118 Q 0 -124 9 -118 L 6 -32 Z" fill="#b45309" />
        <circle cx="0" cy="-78" r="6" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />
      </g>

      <!-- Spoke 8: North-West -->
      <g transform="rotate(315)">
        <path d="M -5 -32 L -8 -118 Q 0 -123 8 -118 L 5 -32 Z" fill="#c2944b" />
        <circle cx="0" cy="-78" r="5" fill="#1e3a5f" stroke="#fde047" stroke-width="1.5" />
      </g>
    </g>

    <!-- 8 Minor Spokes Between Major Spokes -->
    <g stroke="#92400e" stroke-width="1.5" fill="#fde68a">
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(22.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(67.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(112.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(157.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(202.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(247.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(292.5)" />
      <line x1="0" y1="-32" x2="0" y2="-120" transform="rotate(337.5)" />
    </g>

    <!-- Decorative Botanical Green Leaves & Lapis Petals in Inter-Spoke Cavities -->
    <!-- 16 Green Leaves (Nature & Ayurvedic Heritage) -->
    <g fill="#166534" stroke="#14532d" stroke-width="1">
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(22.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(67.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(112.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(157.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(202.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(247.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(292.5)" />
      <path d="M 0 -92 C 10 -98 12 -112 0 -118 C -12 -112 -10 -98 0 -92 Z" transform="rotate(337.5)" />
    </g>

    <!-- 16 Blue Jewel/Lotus Petals in Inner Ring Cavities -->
    <g fill="#1e3a5f" stroke="#0f172a" stroke-width="0.75">
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(22.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(67.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(112.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(157.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(202.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(247.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(292.5)" />
      <path d="M 0 -52 C 8 -56 8 -72 0 -76 C -8 -72 -8 -56 0 -52 Z" transform="rotate(337.5)" />
    </g>

    <!-- Central Axle Hub Ring -->
    <circle cx="0" cy="0" r="34" fill="#5c2605" stroke="#78350f" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="url(#bronzeHub)" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="20" fill="#78350f" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="14" fill="url(#bronzeHub)" />
    
    <!-- Central Cardinal Spindle Pointer -->
    <path d="M 0 -22 L 4 0 L 0 22 L -4 0 Z" fill="#fde047" stroke="#78350f" stroke-width="1" />
    <path d="M -22 0 L 0 4 L 22 0 L 0 -4 Z" fill="#fde047" stroke="#78350f" stroke-width="1" />
    <circle cx="0" cy="0" r="6" fill="#f59e0b" stroke="#451a03" stroke-width="1" />
  </g>

  <!-- ============================================== -->
  <!-- EST. & ROYAL PEACOCK EMBLEM (BOTTOM) -->
  <!-- ============================================== -->
  <g transform="translate(300, 526)">
    <!-- "EST." Text -->
    <text x="-48" y="10" font-family="'Cinzel', 'Playfair Display', serif" font-size="11" font-weight="700" fill="#78350f" letter-spacing="1">EST.</text>

    <!-- Stylized Odisha Royal Peacock Motif (Mayura) -->
    <g transform="translate(0, 6) scale(0.9)">
      <!-- Fan Tail Feathers (Spread fan) -->
      <path d="M -24 -12 C -24 -26 -16 -30 -12 -28 C -8 -26 -14 -14 -18 -8 Z" fill="#9a3412" />
      <path d="M -16 -16 C -16 -32 -6 -36 -2 -34 C 2 -32 -8 -16 -10 -10 Z" fill="#d97706" />
      <path d="M -8 -18 C -6 -34 6 -36 8 -34 C 10 -32 0 -18 -2 -12 Z" fill="#15803d" />
      <path d="M 0 -18 C 6 -34 18 -34 20 -30 C 20 -26 8 -18 6 -12 Z" fill="#0d9488" />
      <path d="M 8 -16 C 16 -30 26 -28 28 -24 C 28 -20 14 -14 12 -8 Z" fill="#1e40af" />

      <!-- Inner Feather Eyes -->
      <circle cx="-16" cy="-22" r="2" fill="#fde047" />
      <circle cx="-8" cy="-26" r="2.2" fill="#fde047" />
      <circle cx="2" cy="-26" r="2.2" fill="#fde047" />
      <circle cx="12" cy="-24" r="2" fill="#fde047" />
      <circle cx="20" cy="-18" r="1.8" fill="#fde047" />

      <!-- Peacock Body & Head (Royal Blue) -->
      <path d="M 0 6 C -4 4 -6 -2 -3 -8 C -1 -12 2 -14 4 -12 C 6 -10 4 -6 2 -2 C 2 2 3 5 0 6 Z" fill="#1e3a5f" stroke="#0f172a" stroke-width="0.5" />
      <!-- Crest Feathers -->
      <circle cx="4" cy="-14" r="1" fill="#f59e0b" />
      <circle cx="2" cy="-15" r="1" fill="#f59e0b" />
      <!-- Beak -->
      <polygon points="4,-11 8,-10 4,-9" fill="#d97706" />
    </g>
  </g>
</svg>
